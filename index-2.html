<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice Room Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #15161c;
    --paper: #f5f5f3;
    --panel: #ffffff;
    --line: #e3e3df;
    --muted: #6c6e76;
    --indigo: #4338ca;
    --indigo-ink: #ffffff;
    --teal: #0d8f83;
    --teal-bg: #e6f5f3;
    --amber: #b4530a;
    --amber-bg: #fbf1e5;
    --brick: #b3261e;
    --brick-bg: #fceeed;
    --focus: #4338ca;
    --radius: 14px;
    --radius-sm: 9px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'Inter', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f1f1ef;
      --paper: #101114;
      --panel: #191a1f;
      --line: #2b2c33;
      --muted: #9799a3;
      --indigo: #8b85f4;
      --indigo-ink: #101114;
      --teal: #3fc2b3;
      --teal-bg: #10302c;
      --amber: #e2a25a;
      --amber-bg: #332411;
      --brick: #f08a83;
      --brick-bg: #33191a;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.45;
    min-height: 100vh;
  }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }

  .wrap { max-width: 960px; margin: 0 auto; padding: 28px 18px 100px; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 14px; margin-bottom: 6px; }
  .brand { display: flex; align-items: center; gap: 11px; }
  .mark {
    width: 38px; height: 38px; border-radius: 10px; background: var(--ink); color: var(--paper);
    display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  }
  .mark svg { width: 20px; height: 20px; }
  h1 { font-family: var(--font-display); font-size: 1.32rem; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.87rem; margin-top: 1px; }

  .icon-btn {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0; transition: border-color 0.15s, transform 0.1s;
  }
  .icon-btn:hover { border-color: var(--ink); }
  .icon-btn:active { transform: scale(0.94); }
  .icon-btn svg { width: 18px; height: 18px; }

  .status-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 18px 0 22px; padding: 10px 14px; border-radius: var(--radius-sm);
    background: var(--panel); border: 1px solid var(--line); font-size: 0.83rem; color: var(--muted);
  }
  .status-bar .who { display: flex; align-items: center; gap: 7px; color: var(--ink); font-weight: 500; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: 0 0 auto; }
  .status-dot.on { background: var(--teal); }
  .status-bar button.link {
    background: none; border: none; color: var(--indigo); font-family: inherit; font-size: 0.83rem;
    font-weight: 600; cursor: pointer; padding: 0; width: auto;
  }

  .days-scroll { display: flex; gap: 14px; overflow-x: auto; padding: 2px 2px 12px; scroll-snap-type: x proximity; }
  .day-col { flex: 0 0 auto; width: 30%; min-width: 152px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 8px; }
  @media (max-width: 480px) { .day-col { width: 80%; } }

  .day-head { padding: 2px 2px 12px; margin-bottom: 2px; border-bottom: 1px solid var(--line); }
  .day-head.today { border-bottom: 2px solid var(--indigo); }
  .day-name { font-family: var(--font-display); font-size: 0.98rem; font-weight: 600; }
  .day-date { font-size: 0.78rem; color: var(--muted); margin-top: 1px; }
  .day-head.today .day-name::after {
    content: '· today'; font-family: var(--font-body); font-weight: 500; font-size: 0.72rem; color: var(--indigo); margin-left: 6px;
  }

  .slot {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 11px 12px; background: var(--panel);
    transition: border-color 0.15s;
  }
  .slot.state-open { border-color: color-mix(in srgb, var(--teal) 55%, var(--line)); }
  .slot.state-full { border-color: var(--line); background: color-mix(in srgb, var(--muted) 6%, var(--panel)); }
  .period-name { font-family: var(--font-display); font-weight: 600; font-size: 0.9rem; }
  .period-time { font-size: 0.73rem; color: var(--muted); margin-top: 1px; }

  .pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 0.71rem; font-weight: 600;
    padding: 3px 8px; border-radius: 999px; margin-top: 8px;
  }
  .pill-closed { color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
  .pill-open { color: var(--teal); background: var(--teal-bg); }
  .pill-pending { color: var(--amber); background: var(--amber-bg); }
  .pill-full { color: var(--brick); background: var(--brick-bg); }

  .slot-sup { font-size: 0.72rem; color: var(--muted); margin-top: 6px; }

  button.action {
    font-family: var(--font-body); cursor: pointer; border: none; border-radius: var(--radius-sm);
    padding: 8px 10px; font-size: 0.78rem; font-weight: 600; width: 100%; margin-top: 9px;
    transition: filter 0.12s, transform 0.08s;
  }
  button.action:active { transform: scale(0.98); }
  .btn-primary { background: var(--indigo); color: var(--indigo-ink); }
  .btn-primary:hover { filter: brightness(1.08); }
  .btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .btn-ghost:hover { border-color: var(--ink); }
  .btn-danger-ghost { background: transparent; border: 1px solid var(--brick); color: var(--brick); }
  .btn-row { display: flex; gap: 6px; margin-top: 9px; }
  .btn-row .action { margin-top: 0; }

  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(15, 16, 20, 0.5); backdrop-filter: blur(1px);
    display: flex; align-items: flex-end; justify-content: center; z-index: 30;
    animation: fadeIn 0.15s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (min-width: 520px) { .modal-backdrop { align-items: center; } }
  .modal {
    background: var(--panel); border: 1px solid var(--line); border-radius: 18px 18px 0 0;
    padding: 22px; width: 100%; max-width: 440px; max-height: 86vh; overflow-y: auto;
    animation: slideUp 0.18s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @media (min-width: 520px) { .modal { border-radius: 16px; } }
  .modal h3 { font-family: var(--font-display); margin: 0 0 3px; font-size: 1.08rem; font-weight: 600; }
  .modal .sub { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); font-family: inherit; font-size: 0.9rem; margin-bottom: 10px;
  }
  .modal textarea { resize: vertical; min-height: 58px; }
  .modal-actions { display: flex; gap: 8px; margin-top: 6px; }
  .modal-actions .action { margin-top: 0; }
  .error-text { color: var(--brick); font-size: 0.79rem; margin: -3px 0 10px; }

  ul.disclaimer { padding-left: 0; list-style: none; margin: 0 0 18px; display: flex; flex-direction: column; gap: 10px; }
  ul.disclaimer li { font-size: 0.86rem; line-height: 1.5; padding-left: 26px; position: relative; }
  ul.disclaimer li::before {
    content: attr(data-n); position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 5px;
    background: var(--indigo); color: var(--indigo-ink); font-size: 0.68rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .fab {
    position: fixed; right: 18px; bottom: 22px; width: 50px; height: 50px; border-radius: 50%;
    background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center;
    cursor: pointer; border: none; box-shadow: 0 6px 18px rgba(0,0,0,0.2); z-index: 15; transition: transform 0.12s;
  }
  .fab:active { transform: scale(0.93); }
  .fab svg { width: 22px; height: 22px; }

  .sidebar-overlay { position: fixed; inset: 0; background: rgba(15,16,20,0.45); z-index: 25; animation: fadeIn 0.15s ease-out; }
  .sidebar {
    position: fixed; top: 0; right: 0; bottom: 0; width: 88%; max-width: 380px; background: var(--panel);
    border-left: 1px solid var(--line); z-index: 26; padding: 20px 18px 34px; overflow-y: auto;
    animation: slideIn 0.18s ease-out;
  }
  @keyframes slideIn { from { transform: translateX(24px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  .sidebar-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sidebar-head h2 { font-family: var(--font-display); font-size: 1.12rem; margin: 0; font-weight: 600; }
  .sec-title { font-size: 0.74rem; font-weight: 700; color: var(--muted); margin: 22px 0 9px; }
  .sec-title:first-of-type { margin-top: 0; }
  .stat-card {
    background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm);
    padding: 11px 13px; margin-bottom: 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 10px;
  }
  .stat-label { font-size: 0.78rem; color: var(--muted); }
  .stat-value { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; text-align: right; }
  .app-item { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 11px 13px; margin-bottom: 8px; }
  .app-name { font-weight: 600; font-size: 0.87rem; }
  .app-msg { font-size: 0.79rem; color: var(--muted); margin-top: 3px; }
  .empty-note { font-size: 0.8rem; color: var(--muted); padding: 5px 0 2px; }
  .sup-row {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 9px 4px; border-bottom: 1px solid var(--line); font-size: 0.85rem;
  }
  .sup-row:last-child { border-bottom: none; }
  .sup-actions { display: flex; gap: 4px; flex: 0 0 auto; }
  .mini-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; color: var(--ink);
  }
  .mini-btn:hover { border-color: var(--ink); }
  .mini-btn svg { width: 13px; height: 13px; }
  .mini-btn.danger { color: var(--brick); }

  .list-block { border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 4px; }
  .list-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 11px; border-bottom: 1px solid var(--line); }
  .list-row:last-child { border-bottom: none; }
  .list-row-info { min-width: 0; }
  .list-row-name { font-size: 0.86rem; font-weight: 600; }
  .list-row-meta { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }
  .list-row-actions { display: flex; gap: 5px; flex: 0 0 auto; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--paper);
    padding: 10px 18px; border-radius: 999px; font-size: 0.84rem; opacity: 0; transition: opacity 0.25s;
    pointer-events: none; z-index: 40; max-width: 88vw; text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>

  <header>
    <div class="brand">
      <div class="mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M9 8h6M9 12h6M9 16h3"></path></svg>

<script>

  appId: "1:958349069214:web:4ffb12a3f39242bd41648f",

};

<script>
(function() {
  const PERIODS = [
    { id: 'p1', name: 'Period 1', time: '9:30–10:25', minutes: 55 },
    { id: 'p2', name: 'Period 2', time: '10:25–11:20', minutes: 55 },
    { id: 'br', name: 'Break',    time: '11:20–11:40', minutes: 20 },
    { id: 'p3', name: 'Period 3', time: '11:40–12:40', minutes: 60 },
    { id: 'p4', name: 'Period 4', time: '12:40–13:40', minutes: 60 },
    { id: 'l1', name: 'Lunch 1',  time: '13:40–14:10', minutes: 30 },
    { id: 'l2', name: 'Lunch 2',  time: '14:10–14:40', minutes: 30 },
    { id: 'p5', name: 'Period 5', time: '14:40–15:35', minutes: 55 },
    { id: 'p6', name: 'Period 6', time: '15:35–16:30', minutes: 55 }
  ];
  const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const DAYS_SHOWN = 3;
  const CAPACITY = 10;

  let cells = {};            // id -> {status, supervisor, pending:[], confirmed:[]}
  let supervisors = [];      // [{id, name}]
  let supervisorApps = [];   // [{id, name, message}] (admin only)
  let isAdmin = false;
  let authChecked = false;
  let sidebarOpen = false;
  let unsubApps = null;

  const app = document.getElementById('app');
  const subline = document.getElementById('subline');
  const modeBanner = document.getElementById('modeBanner');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const supFab = document.getElementById('supFab');

  const ICONS = {
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"></path></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>',
    pencil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"></path></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>'
  };

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }
  function escapeHtml(s) {
    if (!s) return '';
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function dateStr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function fmtDate(d) { return `${d.getMonth() + 1}/${d.getDate()}`; }
  function isSameDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }

  // Skip weekends — only the next DAYS_SHOWN weekdays, starting today
  function getVisibleDays() {
    const days = [];
    let d = new Date(); d.setHours(0, 0, 0, 0);
    while (days.length < DAYS_SHOWN) {
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6) days.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return days;
  }

  function cellKey(ds, pid) { return ds + '_' + pid; }
  function getCell(ds, pid) {
    const c = cells[cellKey(ds, pid)];
    return {
      status: c ? c.status : 'closed',
      supervisor: c ? (c.supervisor || '') : '',
      pending: c && c.pending ? c.pending : [],
      confirmed: c && c.confirmed ? c.confirmed : []
    };
  }

  // ---------- stats (admin sidebar) ----------
  function computeStats() {
    const nameCounts = {}, instrCounts = {};
    let totalMinutes = 0;
    Object.keys(cells).forEach(key => {
      const cell = cells[key];
      const confirmed = cell.confirmed || [];
      if (confirmed.length === 0) return;
      const pid = key.split('_')[1];
      const period = PERIODS.find(p => p.id === pid);
      if (period) totalMinutes += period.minutes * confirmed.length;
      confirmed.forEach(p => {
        if (p.name) nameCounts[p.name] = (nameCounts[p.name] || 0) + 1;
        if (p.instrument) instrCounts[p.instrument] = (instrCounts[p.instrument] || 0) + 1;
      });
    });
    const topOf = (obj) => {
      let best = null, bestN = 0;
      Object.keys(obj).forEach(k => { if (obj[k] > bestN) { best = k; bestN = obj[k]; } });
      return best ? `${best} (${bestN})` : '—';
    };
    return { topVisitor: topOf(nameCounts), totalHours: (totalMinutes / 60).toFixed(1), topInstrument: topOf(instrCounts) };
  }

  // ---------- main render ----------
  function render() {
    const days = getVisibleDays();
    const today = new Date();

    subline.textContent = isAdmin
      ? 'Open a period, review requests, keep the room full but not over.'
      : 'Open periods below — apply for a spot.';

    modeBanner.style.display = 'flex';
    if (isAdmin) {
      modeBanner.innerHTML = `<span class="who"><span class="status-dot on"></span>Signed in as admin</span><button class="link" id="signOutLink">Sign out</button>`;
      document.getElementById('signOutLink').onclick = () => auth.signOut();
    } else if (authChecked) {
      modeBanner.innerHTML = `<span class="who"><span class="status-dot"></span>Viewing as a visitor</span><button class="link" id="adminLoginLink">Admin sign in</button>`;
      document.getElementById('adminLoginLink').onclick = openAdminLoginModal;
    } else {
      modeBanner.innerHTML = `<span class="who">Checking access…</span>`;
    }

    sidebarToggle.style.display = isAdmin ? 'flex' : 'none';
    supFab.style.display = (!isAdmin && authChecked) ? 'flex' : 'none';

    let html = '<div class="days-scroll">';
    days.forEach(d => {
      const ds = dateStr(d);
      const todayCls = isSameDate(d, today) ? ' today' : '';
      html += `<div class="day-col">
        <div class="day-head${todayCls}">
          <div class="day-name">${DAY_NAMES[d.getDay()]}</div>
          <div class="day-date">${fmtDate(d)}</div>
        </div>`;
      PERIODS.forEach(period => { html += renderSlot(ds, period); });
      html += '</div>';
    });
    html += '</div>';
    app.innerHTML = html;
    attachHandlers();
    renderSidebar();
  }

  function renderSlot(ds, period) {
    const cell = getCell(ds, period.id);
    const confirmedN = cell.confirmed.length;
    const pendingN = cell.pending.length;
    const isFull = confirmedN >= CAPACITY;
    let stateCls = '';
    let pill = '';
    let extra = '';
    const supLine = cell.supervisor ? `<div class="slot-sup">Supervisor: ${escapeHtml(cell.supervisor)}</div>` : '';

    if (cell.status === 'closed') {
      pill = `<span class="pill pill-closed">Closed</span>`;
      if (isAdmin) extra = `<button class="action btn-ghost" data-action="open" data-ds="${ds}" data-pid="${period.id}">Open</button>`;
    } else {
      stateCls = isFull ? 'state-full' : 'state-open';
      if (isAdmin) {
        pill = isFull
          ? `<span class="pill pill-full">Full · ${confirmedN}/${CAPACITY}</span>`
          : `<span class="pill pill-open">${confirmedN}/${CAPACITY} confirmed</span>`;
        if (pendingN > 0) pill += ` <span class="pill pill-pending">${pendingN} pending</span>`;
        extra = `<button class="action btn-primary" data-action="manage" data-ds="${ds}" data-pid="${period.id}">Manage</button>`;
      } else {
        pill = isFull
          ? `<span class="pill pill-full">Full</span>`
          : `<span class="pill pill-open">${confirmedN}/${CAPACITY} spots filled</span>`;
        if (!isFull) extra = `<button class="action btn-primary" data-action="apply" data-ds="${ds}" data-pid="${period.id}">Apply</button>`;
      }
    }

    return `<div class="slot ${stateCls}">
      <div class="period-name">${escapeHtml(period.name)}</div>
      <div class="period-time">${escapeHtml(period.time)}</div>
      ${pill}
      ${cell.status !== 'closed' ? supLine : ''}
      ${extra}
    </div>`;
  }

  function attachHandlers() {
    app.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action, ds = btn.dataset.ds, pid = btn.dataset.pid;
        if (action === 'open') openPeriodModal(ds, pid);
        else if (action === 'manage') openManageModal(ds, pid);
        else if (action === 'apply') openApplyModal(ds, pid);
      });
    });
    sidebarToggle.onclick = () => { sidebarOpen = true; renderSidebar(); };
    supFab.onclick = openSupervisorAppModal;
  }

  // ---------- Firestore refs ----------
  const cellsRef = db.collection('cells');
  const supervisorsRef = db.collection('supervisors');
  const appsRef = db.collection('supervisorApps');

  async function openCellWith(ds, pid, supName) {
    try { await cellsRef.doc(cellKey(ds, pid)).set({ status: 'open', supervisor: supName, pending: [], confirmed: [] }); }
    catch (e) { showToast('Could not open — ' + e.message); }
  }
  async function closeCell(ds, pid) {
    try { await cellsRef.doc(cellKey(ds, pid)).set({ status: 'closed', supervisor: '', pending: [], confirmed: [] }); }
    catch (e) { showToast('Could not close — ' + e.message); }
  }
  async function acceptPending(ds, pid, personId) {
    const cell = getCell(ds, pid);
    if (cell.confirmed.length >= CAPACITY) { showToast('This period is already full'); return; }
    const person = cell.pending.find(p => p.id === personId);
    if (!person) return;
    const newPending = cell.pending.filter(p => p.id !== personId);
    const newConfirmed = [...cell.confirmed, person];
    try { await cellsRef.doc(cellKey(ds, pid)).update({ pending: newPending, confirmed: newConfirmed }); }
    catch (e) { showToast('Could not accept — ' + e.message); }
  }
  async function declinePending(ds, pid, personId) {
    const cell = getCell(ds, pid);
    const newPending = cell.pending.filter(p => p.id !== personId);
    try { await cellsRef.doc(cellKey(ds, pid)).update({ pending: newPending }); }
    catch (e) { showToast('Could not decline — ' + e.message); }
  }
  async function removeConfirmed(ds, pid, personId) {
    const cell = getCell(ds, pid);
    const newConfirmed = cell.confirmed.filter(p => p.id !== personId);
    try { await cellsRef.doc(cellKey(ds, pid)).update({ confirmed: newConfirmed }); }
    catch (e) { showToast('Could not remove — ' + e.message); }
  }
  async function applyToCell(ds, pid, name, instrument, note) {
    const cell = getCell(ds, pid);
    if (cell.confirmed.length >= CAPACITY) { showToast('This period just filled up'); return false; }
    const person = { id: uid(), name, instrument, note };
    const newPending = [...cell.pending, person];
    try { await cellsRef.doc(cellKey(ds, pid)).update({ pending: newPending }); return true; }
    catch (e) { showToast('Could not send request — ' + e.message); return false; }
  }

  // ---------- modals ----------
  function openPeriodModal(ds, pid) {
    const period = PERIODS.find(p => p.id === pid);
    const d = new Date(ds + 'T00:00:00');
    const title = `${period.name} · ${DAY_NAMES[d.getDay()]} ${fmtDate(d)}`;
    let options = `<option value="Me">Me (you)</option>`;
    supervisors.forEach(s => { options += `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`; });

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Open ${escapeHtml(title)}</h3>
        <div class="sub">Who's supervising this period? Up to ${CAPACITY} people can join.</div>
        <select id="supSelect">${options}</select>
        <div class="modal-actions">
          <button class="action btn-ghost" id="mCancel">Cancel</button>
          <button class="action btn-primary" id="mConfirm">Open period</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('mCancel').onclick = () => backdrop.remove();
    document.getElementById('mConfirm').onclick = () => {
      const sup = document.getElementById('supSelect').value;
      backdrop.remove();
      openCellWith(ds, pid, sup);
    };
  }

  function openManageModal(ds, pid) {
    const period = PERIODS.find(p => p.id === pid);
    const d = new Date(ds + 'T00:00:00');
    const title = `${period.name} · ${DAY_NAMES[d.getDay()]} ${fmtDate(d)}`;

    function draw() {
      const cell = getCell(ds, pid);
      const pendingHtml = cell.pending.length === 0
        ? '<div class="empty-note">No pending requests.</div>'
        : `<div class="list-block">${cell.pending.map(p => `
            <div class="list-row">
              <div class="list-row-info">
                <div class="list-row-name">${escapeHtml(p.name)}</div>
                <div class="list-row-meta">${[p.instrument, p.note].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</div>
              </div>
              <div class="list-row-actions">
                <button class="mini-btn" data-pending-accept="${p.id}" title="Accept">${ICONS.check}</button>
                <button class="mini-btn danger" data-pending-decline="${p.id}" title="Decline">${ICONS.x}</button>
              </div>
            </div>`).join('')}</div>`;

      const confirmedHtml = cell.confirmed.length === 0
        ? '<div class="empty-note">No one confirmed yet.</div>'
        : `<div class="list-block">${cell.confirmed.map(p => `
            <div class="list-row">
              <div class="list-row-info">
                <div class="list-row-name">${escapeHtml(p.name)}</div>
                <div class="list-row-meta">${[p.instrument, p.note].filter(Boolean).map(escapeHtml).join(' · ') || '—'}</div>
              </div>
              <div class="list-row-actions">
                <button class="mini-btn danger" data-confirmed-remove="${p.id}" title="Remove">${ICONS.close}</button>
              </div>
            </div>`).join('')}</div>`;

      modalEl.innerHTML = `
        <h3>${escapeHtml(title)}</h3>
        <div class="sub">${cell.confirmed.length}/${CAPACITY} confirmed${cell.supervisor ? ' · Supervisor: ' + escapeHtml(cell.supervisor) : ''}</div>
        <div class="sec-title" style="margin-top:2px;">Pending requests</div>
        ${pendingHtml}
        <div class="sec-title">Confirmed</div>
        ${confirmedHtml}
        <div class="modal-actions" style="margin-top:16px;">
          <button class="action btn-ghost" id="mmClose">Close panel</button>
          <button class="action btn-danger-ghost" id="mmClosePeriod">Close period</button>
        </div>`;

      modalEl.querySelectorAll('[data-pending-accept]').forEach(b => b.onclick = async () => { await acceptPending(ds, pid, b.dataset.pendingAccept); draw(); });
      modalEl.querySelectorAll('[data-pending-decline]').forEach(b => b.onclick = async () => { await declinePending(ds, pid, b.dataset.pendingDecline); draw(); });
      modalEl.querySelectorAll('[data-confirmed-remove]').forEach(b => b.onclick = async () => { await removeConfirmed(ds, pid, b.dataset.confirmedRemove); draw(); });
      document.getElementById('mmClose').onclick = () => backdrop.remove();
      document.getElementById('mmClosePeriod').onclick = async () => { await closeCell(ds, pid); backdrop.remove(); };
    }

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    const modalEl = document.createElement('div');
    modalEl.className = 'modal';
    backdrop.appendChild(modalEl);
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    draw();
  }

  function openApplyModal(ds, pid) {
    const period = PERIODS.find(p => p.id === pid);
    const d = new Date(ds + 'T00:00:00');
    const title = `${period.name} (${period.time}) · ${DAY_NAMES[d.getDay()]} ${fmtDate(d)}`;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Apply for ${escapeHtml(title)}</h3>
        <div class="sub">The admin will approve or decline your request.</div>
        <input type="text" id="applyName" placeholder="Your name" maxlength="60">
        <input type="text" id="applyInstrument" placeholder="Instrument (optional)" maxlength="40">
        <textarea id="applyNote" placeholder="Reason (optional)" maxlength="200"></textarea>
        <div class="modal-actions">
          <button class="action btn-ghost" id="applyCancel">Cancel</button>
          <button class="action btn-primary" id="applySubmit">Send request</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    document.getElementById('applyCancel').onclick = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('applySubmit').onclick = async () => {
      const name = document.getElementById('applyName').value.trim();
      const instrument = document.getElementById('applyInstrument').value.trim();
      const note = document.getElementById('applyNote').value.trim();
      if (!name) { showToast('Please enter your name'); return; }
      const ok = await applyToCell(ds, pid, name, instrument, note);
      if (ok) { backdrop.remove(); showToast('Request sent!'); }
    };
  }

  function openSupervisorAppModal() {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Apply to be a supervisor</h3>
        <div class="sub">The admin reviews every request — this doesn't grant site access, it just adds you to the supervisor list.</div>
        <input type="text" id="supName" placeholder="Your name" maxlength="60">
        <textarea id="supMsg" placeholder="Anything you'd like to add (optional)" maxlength="200"></textarea>
        <div class="modal-actions">
          <button class="action btn-ghost" id="supCancel">Cancel</button>
          <button class="action btn-primary" id="supSubmit">Send application</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    document.getElementById('supCancel').onclick = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('supSubmit').onclick = async () => {
      const name = document.getElementById('supName').value.trim();
      const message = document.getElementById('supMsg').value.trim();
      if (!name) { showToast('Please enter your name'); return; }
      try {
        await appsRef.add({ name, message, ts: firebase.firestore.FieldValue.serverTimestamp() });
        backdrop.remove();
        showToast('Application sent!');
      } catch (e) { showToast('Could not send — ' + e.message); }
    };
  }

  function openAdminLoginModal() {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Admin sign in</h3>
        <div class="sub">Only you have this password.</div>
        <input type="email" id="adminEmail" placeholder="Email" autocomplete="username">
        <input type="password" id="adminPass" placeholder="Password" autocomplete="current-password">
        <div class="error-text" id="loginError" style="display:none;"></div>
        <div class="modal-actions">
          <button class="action btn-ghost" id="loginCancel">Cancel</button>
          <button class="action btn-primary" id="loginSubmit">Sign in</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    document.getElementById('loginCancel').onclick = () => backdrop.remove();
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('loginSubmit').onclick = async () => {
      const email = document.getElementById('adminEmail').value.trim();
      const pass = document.getElementById('adminPass').value;
      const errEl = document.getElementById('loginError');
      try { await auth.signInWithEmailAndPassword(email, pass); backdrop.remove(); }
      catch (e) { errEl.textContent = 'Sign-in failed — check email and password.'; errEl.style.display = 'block'; }
    };
  }

  function showDisclaimer() {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Before you head in</h3>
        <ul class="disclaimer">
          <li data-n="1">Doors lock 5 minutes into each period — after that, no one gets let in.</li>
          <li data-n="2">Rooms are limited, so it's first-come, first-served.</li>
          <li data-n="3">Everyone inside needs to actually be doing something music-related to keep their spot.</li>
        </ul>
        <div class="modal-actions">
          <button class="action btn-primary" id="discOk" style="width:100%;">Got it</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    document.getElementById('discOk').onclick = () => backdrop.remove();
  }

  // ---------- sidebar (admin only) ----------
  function renderSidebar() {
    const existing = document.getElementById('adminSidebarOverlay');
    if (existing) existing.remove();
    if (!isAdmin || !sidebarOpen) return;

    const stats = computeStats();
    let appsHtml = supervisorApps.length === 0
      ? '<div class="empty-note">No pending applications.</div>'
      : supervisorApps.map(a => `
        <div class="app-item">
          <div class="app-name">${escapeHtml(a.name)}</div>
          ${a.message ? `<div class="app-msg">"${escapeHtml(a.message)}"</div>` : ''}
          <div class="btn-row">
            <button class="action btn-primary" data-supaction="accept" data-id="${a.id}">Accept</button>
            <button class="action btn-danger-ghost" data-supaction="decline" data-id="${a.id}">Decline</button>
          </div>
        </div>`).join('');

    let supRows = supervisors.length === 0
      ? '<div class="empty-note">No approved supervisors yet.</div>'
      : supervisors.map(s => `
        <div class="sup-row">
          <span>${escapeHtml(s.name)}</span>
          <div class="sup-actions">
            <button class="mini-btn" data-editsup="${s.id}" data-name="${escapeHtml(s.name)}" title="Rename">${ICONS.pencil}</button>
            <button class="mini-btn danger" data-removesup="${s.id}" title="Remove">${ICONS.trash}</button>
          </div>
        </div>`).join('');

    const overlay = document.createElement('div');
    overlay.id = 'adminSidebarOverlay';
    overlay.innerHTML = `
      <div class="sidebar-overlay" id="sbOverlayBg"></div>
      <div class="sidebar">
        <div class="sidebar-head"><h2>Admin panel</h2><button class="icon-btn" id="sbClose">${ICONS.close}</button></div>
        <div class="sec-title">Statistics</div>
        <div class="stat-card"><div class="stat-label">Most frequent visitor</div><div class="stat-value">${escapeHtml(stats.topVisitor)}</div></div>
        <div class="stat-card"><div class="stat-label">Total hours supervised</div><div class="stat-value">${stats.totalHours} h</div></div>
        <div class="stat-card"><div class="stat-label">Most popular instrument</div><div class="stat-value">${escapeHtml(stats.topInstrument)}</div></div>
        <div class="sec-title">Supervisor applications</div>
        ${appsHtml}
        <div class="sec-title">Approved supervisors</div>
        ${supRows}
      </div>`;
    document.body.appendChild(overlay);
    document.getElementById('sbClose').onclick = () => { sidebarOpen = false; renderSidebar(); };
    document.getElementById('sbOverlayBg').onclick = () => { sidebarOpen = false; renderSidebar(); };

    overlay.querySelectorAll('button[data-supaction]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id, action = btn.dataset.supaction;
        const entry = supervisorApps.find(a => a.id === id);
        if (!entry) return;
        try {
          if (action === 'accept') {
            const already = supervisors.some(s => s.name.toLowerCase() === entry.name.toLowerCase());
            if (!already) await supervisorsRef.add({ name: entry.name });
          }
          await appsRef.doc(id).delete();
        } catch (e) { showToast('Action failed — ' + e.message); }
      });
    });
    overlay.querySelectorAll('button[data-removesup]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await supervisorsRef.doc(btn.dataset.removesup).delete(); }
        catch (e) { showToast('Could not remove — ' + e.message); }
      });
    });
    overlay.querySelectorAll('button[data-editsup]').forEach(btn => {
      btn.addEventListener('click', () => openRenameSupervisorModal(btn.dataset.editsup, btn.dataset.name));
    });
  }

  function openRenameSupervisorModal(id, currentName) {
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Rename supervisor</h3>
        <input type="text" id="renameInput" value="${escapeHtml(currentName)}" maxlength="60">
        <div class="modal-actions">
          <button class="action btn-ghost" id="renameCancel">Cancel</button>
          <button class="action btn-primary" id="renameSave">Save</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) backdrop.remove(); });
    document.getElementById('renameCancel').onclick = () => backdrop.remove();
    document.getElementById('renameSave').onclick = async () => {
      const newName = document.getElementById('renameInput').value.trim();
      if (!newName) { showToast('Name can\'t be empty'); return; }
      try { await supervisorsRef.doc(id).update({ name: newName }); backdrop.remove(); }
      catch (e) { showToast('Could not rename — ' + e.message); }
    };
  }

  // ---------- live data ----------
  cellsRef.onSnapshot(snap => {
    cells = {};
    snap.forEach(doc => { cells[doc.id] = doc.data(); });
    render();
  }, err => showToast('Sync error — ' + err.message));

  supervisorsRef.onSnapshot(snap => {
    supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderSidebar();
  }, err => console.error(err));

  auth.onAuthStateChanged(user => {
    authChecked = true;
    isAdmin = !!(user && user.uid === ADMIN_UID);

    if (unsubApps) { unsubApps(); unsubApps = null; }
    if (isAdmin) {
      unsubApps = appsRef.onSnapshot(snap => {
        supervisorApps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderSidebar();
      }, err => showToast('Could not load applications — ' + err.message));
    } else {
      supervisorApps = [];
    }

    render();
    if (!isAdmin) showDisclaimer();
  });

  render();
})();
</script>
</body>
</html>
