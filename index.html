<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script>
  // Each music theme brings its own typefaces; only the chosen theme's fonts are downloaded
  window.GENRE_FONTS = {
    jazz: 'family=Bebas+Neue&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Instrument+Sans:wght@400;500;600;700',
    classical: 'family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Instrument+Sans:wght@400;500;600;700',
    rock: 'family=Anton&family=Oswald:wght@500;600&family=Space+Grotesk:wght@400;500;600;700'
  };
  window.loadGenreFonts = function (genre) {
    if (document.getElementById('fonts-' + genre)) return;
    var l = document.createElement('link');
    l.id = 'fonts-' + genre; l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?' + window.GENRE_FONTS[genre] + '&display=swap';
    document.head.appendChild(l);
  };
  // Resolve the theme before first paint so there's no flash of the other one
  (function () {
    var pref = null;
    try { pref = JSON.parse(localStorage.getItem('pr-theme')); } catch (e) {}
    var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    var genre = 'jazz';
    try { genre = JSON.parse(localStorage.getItem('pr-genre')) || 'jazz'; } catch (e) {}
    if (['jazz', 'classical', 'rock'].indexOf(genre) < 0) genre = 'jazz';
    document.documentElement.setAttribute('data-genre', genre);
    window.loadGenreFonts(genre);
  })();
</script>

  :root[data-genre="classical"] {
    color-scheme: light;
    --bg: #120A0B;
    --art: url('img/classical.webp');
    --art-phone: url('img/classical-phone.webp');
    --ink: #1E1616; --ink-2: #4A3F3C; --muted: #65574F;
    --on-bg: #F3EBDD; --on-bg-2: #D8CCBA; --on-bg-muted: #B3A594; --hero-accent: #E2C07A;
    --glass-rgb: 247, 240, 228;
    --line: rgba(30, 22, 22, 0.14); --line-strong: rgba(30, 22, 22, 0.32); --input-line: rgba(30, 22, 22, 0.28);

    --brass: #A8812E;

    --brick: #8A2330; --brick-ink: #8A2330; --brick-soft: rgba(138, 35, 48, 0.13); --brick-line: rgba(138, 35, 48, 0.45);
    --req-rgb: 246, 232, 200; --req-line: rgba(150, 115, 45, 0.55); --req-ink: #654B12; --req-soft: rgba(201, 164, 92, 0.3);
    --inv-bg: #1E1616; --inv-ink: #F7F0E4;
    --mark-bg: #7A1F2B; --mark-icon: #F7F0E4;
    --today-bg: #7A1F2B; --today-ink: #F7F0E4; --tag-bg: #C9A45C; --tag-ink: #1E1616;
    --np-box: #7A1F2B; --np-bar: #F7F0E4;
    --rules-bg: #7A1F2B; --rules-ink: #F7F0E4; --rules-accent: #E2C07A; --rules-title-style: italic;
    --toast-icon: #E2C07A;
    --modal-bg: #F7F0E4; --input-bg: #FFFDF8; --scrim: rgba(10, 5, 6, 0.6);
    --glass: 0.86; --glass-strong: 0.97; --glass-closed: 0.43;
    --display: 'Cormorant Garamond', Georgia, serif;

    --h1-transform: none; --h1-em-style: italic; --h1-em-weight: 500;
  }
  :root[data-genre="rock"] {
    color-scheme: dark;
    --bg: #0B0B0C;
    --art: url('img/rock.webp');
    --art-phone: url('img/rock-phone.webp');
    --ink: #F4F2EE; --ink-2: #DAD6CF; --muted: #A7A29A;
    --on-bg: #F4F2EE; --on-bg-2: #DAD6CF; --on-bg-muted: #A7A29A; --hero-accent: #FF4A3D;
    --glass-rgb: 16, 16, 18;
    --line: rgba(255, 255, 255, 0.14); --line-strong: rgba(255, 255, 255, 0.3); --input-line: rgba(255, 255, 255, 0.3);
    --bar-off: rgba(255, 255, 255, 0.18); --chip: rgba(255, 255, 255, 0.08);
    --shadow: 0 12px 28px -18px rgba(0, 0, 0, 0.9);
    --accent: #FF5A4E; --brand: #D42A22;
    --gold: #D42A22; --gold-ink: #FFFFFF; --apply-border: #D42A22;
    --brass: #FFD84A;
    --teal: #72E0A8; --teal-ink: #72E0A8; --teal-soft: rgba(114, 224, 168, 0.14);
    --brick: #FF4A3D; --brick-ink: #FF8077; --brick-soft: rgba(212, 42, 34, 0.26); --brick-line: rgba(255, 128, 119, 0.5);
    --req-rgb: 38, 32, 8; --req-line: rgba(255, 216, 74, 0.5); --req-ink: #FFD84A; --req-soft: rgba(255, 216, 74, 0.16);

    --mark-bg: #D42A22; --mark-icon: #FFFFFF;
    --today-bg: #D42A22; --today-ink: #FFFFFF; --tag-bg: #0B0B0C; --tag-ink: #FFD84A;
    --np-box: #D42A22; --np-bar: #FFFFFF;
    --rules-bg: #D42A22; --rules-ink: #FFFFFF; --rules-accent: #0B0B0C; --rules-eyebrow: #FFFFFF; --rules-title-style: normal;
    --toast-icon: #0B0B0C;
    --modal-bg: #141416; --input-bg: #0B0B0C; --scrim: rgba(0, 0, 0, 0.7);
    --glass: 0.76; --glass-strong: 0.9; --glass-closed: 0.38;

    --h1-font: 'Anton', 'Oswald', Impact, sans-serif; --h1-min: 50px; --h1-max: 92px; --h1-weight: 400; --h1-ls: 0.01em; --h1-lh: 0.92;

  /* Light/Dark only exists for Jazz */
  :root:not([data-genre="jazz"]) .theme-seg, :root:not([data-genre="jazz"]) .theme-cycle { display: none !important; }
  @media (prefers-reduced-transparency: reduce) {
    :root { --glass: 0.96; --glass-strong: 0.97; --glass-closed: 0.9; --blur: 0px; }
  }

  /* ---------- base ---------- */
  * { box-sizing: border-box; }
  html {
    -webkit-text-size-adjust: 100%; min-height: 100%;
    background: var(--bg) var(--art) center top / cover no-repeat;
  }
  body {
    margin: 0; min-height: 100vh; color: var(--ink);
    font-family: var(--body); font-size: 15px; line-height: 1.45;
  }
  button, input, textarea, select { font-family: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  a { color: var(--ink); }
  a:hover { color: var(--accent); }
  .glass { background: rgba(var(--glass-rgb), var(--glass)); }
  .glass-strong { background: rgba(var(--glass-rgb), var(--glass-strong)); }
  .blur { -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); }
  .ico { width: 18px; height: 18px; flex-shrink: 0; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; scroll-behavior: auto !important; }
  }
  html { scroll-behavior: smooth; }

  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 64px 44px; display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- buttons ---------- */
  .btn {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line-strong);
    background: rgba(var(--glass-rgb), var(--glass-strong)); color: var(--ink);
    font-size: 14px; font-weight: 600; text-decoration: none; white-space: nowrap;
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    transition: filter 0.12s, transform 0.08s;
  }
  .btn:hover { filter: brightness(1.06); color: var(--ink); }
  .btn:active { transform: scale(0.97); }
  .btn.sm { height: 44px; }
  .btn.xs { height: 34px; padding: 0 14px; font-size: 13.5px; background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .btn.primary { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-ink); font-weight: 700; }
  .btn.primary:hover { color: var(--primary-ink); }
  .btn.inverse { background: var(--inv-bg); border-color: var(--inv-bg); color: var(--inv-ink); }
  .btn.inverse:hover { color: var(--inv-ink); }
  .btn.ghost { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .btn.danger { background: transparent; border-color: var(--brick-line); color: var(--brick-ink); font-weight: 700; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .btn.apply { height: 44px; padding: 0 16px 0 18px; border-color: var(--apply-border); background: var(--gold); color: var(--gold-ink); font-weight: 700; -webkit-backdrop-filter: none; backdrop-filter: none; }
  .btn.apply:hover { color: var(--gold-ink); }
  .btn .ico { width: 16px; height: 16px; }
  .icon-btn {
    width: 44px; height: 44px; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 12px; border: 1.5px solid var(--line-strong); background: transparent; color: var(--ink); padding: 0;
  }
  .icon-btn.solid { background: var(--primary-bg); border-color: var(--primary-bg); color: var(--primary-ink); }
  .icon-btn.danger { border-color: var(--brick-line); color: var(--brick-ink); }
  .badge {
    display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; padding: 0 6px;
    border-radius: 999px; background: var(--gold); color: var(--gold-ink); font-size: 12px; font-weight: 700;
  }

  /* ---------- nav ---------- */
  nav.top { min-height: 88px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 10px 0; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 50%; background: var(--mark-bg); color: var(--mark-icon);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .brand-mark .ico { width: 20px; height: 20px; }
  .brand-title { font-family: var(--display); font-size: 20px; font-weight: 600; line-height: 1.15; color: var(--on-bg); }
  .brand-eyebrow { font-size: 11.5px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--on-bg-muted); }
  .nav-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .who {
    display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 5px 0 16px; border-radius: 999px;
    background: rgba(var(--glass-rgb), var(--glass-strong)); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
    font-size: 14px; font-weight: 500; color: var(--ink-2);
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--teal); flex-shrink: 0; }
  .dot.brass { background: var(--brass); }

  /* theme switch */
  .theme-seg {
    display: inline-flex; gap: 2px; padding: 4px; height: 46px; border-radius: 999px;
    background: rgba(var(--glass-rgb), var(--glass-strong)); border: 1px solid var(--line);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
  }
  .theme-seg button {
    width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; color: var(--ink-2);
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .theme-seg button[aria-pressed="true"] { background: var(--inv-bg); color: var(--inv-ink); }
  .theme-seg .ico { width: 17px; height: 17px; }
  .theme-cycle { display: none; }
  .lbl-phone { display: none; }
  .style-pick { position: relative; }
  .style-btn {
    width: 46px; height: 46px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink);
    background: rgba(var(--glass-rgb), var(--glass-strong)); display: inline-flex; align-items: center; justify-content: center; padding: 0;
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur));
  }
  .style-btn[aria-expanded="true"] { background: var(--inv-bg); color: var(--inv-ink); border-color: var(--inv-bg); }
  .style-menu {
    position: absolute; right: 0; top: calc(100% + 8px); z-index: 20; width: 248px; padding: 8px;
    display: flex; flex-direction: column; gap: 4px; border-radius: 18px;
    background: var(--modal-bg); border: 1px solid var(--line); box-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.55);
    animation: rise 0.14s ease-out;
  }
  .style-menu .menu-title { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 4px; }
  .style-menu button {
    display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 6px 10px 6px 6px; border-radius: 12px;
    border: 1.5px solid transparent; background: transparent; color: var(--ink); font-size: 15px; font-weight: 600; text-align: left;
  }
  .style-menu button:hover { background: var(--chip); }
  .style-menu button[aria-pressed="true"] { border-color: var(--accent); background: var(--chip); }
  .style-menu .thumb { width: 40px; height: 48px; border-radius: 8px; flex-shrink: 0; background: var(--bg) center top / cover no-repeat; border: 1px solid var(--line); }
  .style-menu .check { margin-left: auto; color: var(--accent); }
  .style-menu .genre-ico { width: 17px; height: 17px; margin-right: -4px; color: var(--muted); }

  /* ---------- hero ---------- */
  .hero { display: flex; flex-direction: column; gap: 18px; max-width: 660px; padding-top: 16px; }
  .tag {
    align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; min-height: 32px; padding: 4px 14px;
    border-radius: 999px; background: rgba(var(--glass-rgb), var(--glass-strong)); border: 1px solid var(--line);
    font-size: 12.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2);
  }
  .tag .dot { width: 7px; height: 7px; background: var(--brand); }
  h1.headline {
    margin: 0; font-family: var(--h1-font); font-size: clamp(var(--h1-min), 6vw, var(--h1-max)); line-height: var(--h1-lh);
    font-weight: var(--h1-weight); letter-spacing: var(--h1-ls); text-transform: var(--h1-transform); color: var(--on-bg);
  }
  h1.headline em { font-style: var(--h1-em-style); font-weight: var(--h1-em-weight); color: var(--hero-accent); }
  .lede { margin: 0; max-width: 560px; font-size: 18px; line-height: 1.55; color: var(--on-bg-2); }
  .now {
    align-self: flex-start; display: flex; align-items: center; gap: 16px; padding: 12px 20px 12px 12px; border-radius: 18px;
    background: rgba(var(--glass-rgb), var(--glass-strong)); border: 1px solid var(--line); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(var(--blur)); backdrop-filter: blur(var(--blur)); max-width: 100%;
  }
  .now-icon {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; background: var(--np-box);
    display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 12px;
  }
  .now-icon span { width: 4px; border-radius: 2px; background: var(--np-bar); }
  .now-label { font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
  .now-title { font-size: 16px; font-weight: 600; }
  .now-title span { font-weight: 500; color: var(--muted); }
  .now-meter { display: flex; flex-direction: column; gap: 7px; width: 132px; flex-shrink: 0; }

  function icon(name, extraClass) {
    return `<svg class="ico${extraClass ? ' ' + extraClass : ''}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON_PATHS[name]}</svg>`;
  }

  // ---------- small helpers ----------
  function store(key, value) {
    try {
      if (value === undefined) return JSON.parse(localStorage.getItem(key));
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) { return undefined; }
  }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerHTML = icon('note') + '<span></span>';
    t.querySelector('span').textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 3600);
  }
  function escapeHtml(s) {
    if (!s) return '';
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function dateStr(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  function monthDay(d) { return `${MONTHS[d.getMonth()]} ${d.getDate()}`; }
  function longDay(d) { return `${DAY_NAMES[d.getDay()]} ${monthDay(d)}`; }
  function isSameDate(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
  function minuteKey() { const d = new Date(); return dateStr(d) + ' ' + d.getHours() + ':' + d.getMinutes(); }
  function at(ds, hhmm) { return new Date(ds + 'T' + hhmm + ':00'); }

  // Skip weekends — only the next DAYS_SHOWN weekdays, starting today
  function getVisibleDays() {
    const days = [];
    let d = new Date(); d.setHours(0, 0, 0, 0);
    while (days.length < DAYS_SHOWN) {
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6) days.push(new Date(d));
      d.setDate(d.getDate() + 1);
    }
    return days;
  }

  function hasEnded(ds, period) { return at(ds, period.end) <= new Date(); }

  function cellKey(ds, pid) { return ds + '_' + pid; }

  // Docs from older versions of the site (no pending/confirmed arrays) read as closed and empty
  function normalizeCell(c) {
    const ok = !!c && Array.isArray(c.pending) && Array.isArray(c.confirmed);
    return {
      status: ok && c.status === 'open' ? 'open' : 'closed',
      supervisor: ok ? (c.supervisor || '') : '',
      pending: ok ? c.pending : [],
      confirmed: ok ? c.confirmed : [],
      declinedIds: ok && Array.isArray(c.declinedIds) ? c.declinedIds : []
    };
  }
  function getCell(ds, pid) { return normalizeCell(cells[cellKey(ds, pid)]); }

  // ---------- theme (Light / Dark) ----------
  // No saved choice: start from the device setting once, then it's the visitor's call
  function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function syncThemeControls() {
    const t = currentTheme();
    nav.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === t)));
    const cycle = nav.querySelector('.theme-cycle');
    if (cycle) {
      cycle.innerHTML = icon(t === 'dark' ? 'moon' : 'sun');
      cycle.setAttribute('aria-label', `Theme: ${t}. Switch to ${t === 'dark' ? 'light' : 'dark'}`);
    }
  }
  function setTheme(t) {
    store('pr-theme', t);
    // Only the attribute changes, so open forms keep their input
    document.documentElement.setAttribute('data-theme', t);
    syncThemeControls();
  }

  const GENRES = [
    { id: 'jazz', name: 'Jazz' },
    { id: 'classical', name: 'Classical' },
    { id: 'rock', name: 'Rock' }

            rulesEyebrow: 'Before you head in', rulesTitle: 'House rules', nums: ['01', '02', '03'] },

            rulesEyebrow: 'Before the downbeat', rulesTitle: 'Etiquette', nums: ['I', 'II', 'III'] },
    rock: { h1a: 'Plug in.', h1b: 'Turn it up.', now: 'On stage now', setlist: 'This week’s gigs', pick: 'Grab any open period',
            rulesEyebrow: 'Before soundcheck', rulesTitle: 'Backstage rules', nums: ['01', '02', '03'] }
  };
  let styleMenuOpen = false;
  function currentGenre() { const g = document.documentElement.getAttribute('data-genre'); return GENRE_COPY[g] ? g : 'jazz'; }
  function copy() { return GENRE_COPY[currentGenre()]; }
  function setGenre(id) {
    store('pr-genre', id);

  function closeStyleMenu(focusButton) {
    const menu = nav.querySelector('.style-menu');
    if (menu) menu.remove();
    styleMenuOpen = false;
    const btn = nav.querySelector('.style-btn');

  }
  function openStyleMenu() {
    const wrap = nav.querySelector('.style-pick');
    const current = currentGenre();
    const menu = document.createElement('div');
    menu.className = 'style-menu';
    menu.setAttribute('role', 'group');
    menu.setAttribute('aria-label', 'Music theme');
    menu.innerHTML = '<div class="menu-title">Theme</div>' + GENRES.map(g =>
      `<button type="button" data-genre-set="${g.id}" aria-pressed="${g.id === current}">
        <span class="thumb" style="background-image:url('img/${g.id}-phone.webp')"></span>${icon(g.id, 'genre-ico')}${g.name}
        ${g.id === current ? icon('check', 'check') : ''}</button>`).join('');
    wrap.appendChild(menu);

    nav.querySelector('.style-btn').setAttribute('aria-expanded', 'true');
    menu.querySelectorAll('[data-genre-set]').forEach(b => b.onclick = () => { closeStyleMenu(false); setGenre(b.dataset.genreSet); const btn = nav.querySelector('.style-btn'); if (btn) btn.focus(); });
    const pressed = menu.querySelector('[aria-pressed="true"]');
    if (pressed) pressed.focus();
  }
  document.addEventListener('click', e => {
    if (styleMenuOpen && !e.target.closest('.style-pick')) closeStyleMenu(false);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && styleMenuOpen) closeStyleMenu(true);
  });

  // ---------- this browser's own requests ----------
  // Visitors get an invisible anonymous Firebase id, which the rules use to allow
  // one live request per browser per period. The request id is also remembered
  // locally so a declined request can be shown as "Not accepted".
  function myUid() { const u = auth.currentUser; return u && u.isAnonymous ? u.uid : null; }
  function myRequests() { const r = store('pr-requests'); return r && typeof r === 'object' ? r : {}; }
  function myState(cell, key) {
    const uid = myUid();
    if (uid && cell.confirmed.some(p => p.uid === uid)) return 'in';
    if (uid && cell.pending.some(p => p.uid === uid)) return 'requested';
    const id = myRequests()[key];
    if (id && cell.declinedIds.includes(id)) return 'declined';
    return '';
  }
  // Forget remembered requests for days that are no longer on screen
  function pruneMyRequests() {
    const mine = myRequests();
    const visible = new Set(getVisibleDays().map(dateStr));
    let changed = false;
    Object.keys(mine).forEach(key => { if (!visible.has(key.split('_')[0])) { delete mine[key]; changed = true; } });
    if (changed) store('pr-requests', mine);
  }

  // ---------- stats (admin sidebar) ----------
  function computeStats(allCells, details) {
    const nameCounts = {}, instrCounts = {};
    let supervisedMinutes = 0, practiceMinutes = 0;
    // Group case-insensitively, but show the first spelling we saw
    const bump = (counts, raw) => {
      const label = (raw || '').trim();
      if (!label) return;
      const k = label.toLowerCase();
      if (!counts[k]) counts[k] = { label, n: 0 };
      counts[k].n++;
    };
    Object.keys(allCells).forEach(key => {
      const cell = normalizeCell(allCells[key]);
      if (cell.confirmed.length === 0) return;
      const period = PERIODS.find(p => p.id === key.split('_')[1]);
      if (period) {
        supervisedMinutes += period.minutes;
        practiceMinutes += period.minutes * cell.confirmed.length;
      }
      cell.confirmed.forEach(p => {
        bump(nameCounts, p.name);
        bump(instrCounts, details[p.id] ? details[p.id].instrument : p.instrument);
      });
    });
    const topOf = (counts) => {
      let best = null;
      Object.values(counts).forEach(c => { if (!best || c.n > best.n) best = c; });
      return best ? `${best.label} (${best.n})` : '—';
    };
    return {
      topVisitor: topOf(nameCounts),
      supervisedHours: (supervisedMinutes / 60).toFixed(1),
      practiceHours: (practiceMinutes / 60).toFixed(1),
      topInstrument: topOf(instrCounts)
    };
  }

  // Full history is only read when the admin opens the panel, not on every page load
  async function loadStats() {
    stats = 'loading';
    renderSidebar();
    try {
      const [cellSnap, detailSnap] = await Promise.all([cellsRef.get(), requestDetailsRef.get()]);
      const allCells = {}, details = {};
      cellSnap.forEach(doc => { allCells[doc.id] = doc.data(); });
      detailSnap.forEach(doc => { details[doc.id] = doc.data(); });
      stats = computeStats(allCells, details);
    } catch (e) {
      stats = 'error';
      showToast('Could not load statistics — ' + e.message);
    }
    renderSidebar();
  }

  // ---------- render: nav ----------
  function renderNav() {
    const theme = currentTheme();

        <button type="button" class="btn xs inverse" id="adminLoginBtn"><span class="lbl">Admin sign in</span><span class="lbl-phone">Sign in</span></button></div>`;

    const extra = isAdmin
      ? `<button type="button" class="btn primary has-lbl-sm" id="sidebarToggle" aria-label="Admin panel${supervisorApps.length ? ', ' + supervisorApps.length + ' supervisor applications' : ''}">${icon('chart')}<span class="lbl">Admin panel</span>${supervisorApps.length ? `<span class="badge">${supervisorApps.length}</span>` : ''}</button>`
      : `<a class="btn" href="#rules" aria-label="Room rules">${icon('rules')}<span class="lbl">Room rules</span></a>
         ${authChecked ? `<button type="button" class="btn" id="supApplyBtn" aria-label="Become a supervisor">${icon('supervisor')}<span class="lbl">Become a supervisor</span></button>` : ''}`;

    const html = `
      <div class="brand">
        <span class="brand-mark">${icon('note')}</span>

      </div>
      <div class="nav-actions">${who}${extra}${themeControl}</div>`;
    if (html === lastNavHtml) { syncThemeControls(); return; }
    lastNavHtml = html;
    styleMenuOpen = false;
    nav.innerHTML = html;
    nav.querySelector('.style-btn').onclick = () => { if (styleMenuOpen) closeStyleMenu(true); else openStyleMenu(); };

    nav.querySelectorAll('[data-theme-set]').forEach(b => b.onclick = () => setTheme(b.dataset.themeSet));
    nav.querySelector('.theme-cycle').onclick = () => setTheme(currentTheme() === 'dark' ? 'light' : 'dark');
    const signOut = document.getElementById('signOutBtn'); if (signOut) signOut.onclick = () => auth.signOut();
    const login = document.getElementById('adminLoginBtn'); if (login) login.onclick = openAdminLoginModal;
    const sup = document.getElementById('supApplyBtn'); if (sup) sup.onclick = openSupervisorAppModal;
    const side = document.getElementById('sidebarToggle'); if (side) side.onclick = () => { sidebarOpen = true; loadStats(); };
    syncThemeControls();
  }

  // ---------- render: hero ----------
  function nowPlaying(days) {
    const today = days[0];
    if (!isSameDate(today, new Date())) return null;
    const ds = dateStr(today);
    const now = new Date();
    for (const p of PERIODS) {
      const cell = getCell(ds, p.id);
      if (cell.status !== 'open') continue;
      const s = at(ds, p.start), e = at(ds, p.end);
      if (s <= now && now < e) {
        const left = Math.ceil((e - now) / 60000);
        return { label: copy().now, period: p, cell, right: `${left} min left`, pct: Math.round((now - s) / (e - s) * 100) };
      }
      if (now < s) {
        const inMin = Math.ceil((s - now) / 60000);
        return { label: 'Up next', period: p, cell, right: inMin >= 60 ? `Starts at ${p.start.replace(/^0/, '')}` : `Starts in ${inMin} min`, pct: 0 };
      }
    }
    return null;
  }

  function renderHero(days) {
    const np = nowPlaying(days);
    const bars = [10, 18, 13, 20].map(h => `<span style="height:${h}px"></span>`).join('');
    const nowHtml = np ? `
      <div class="now">
        <span class="now-icon" aria-hidden="true">${bars}</span>
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
          <span class="now-label">${np.label}</span>
          <span class="now-title">${escapeHtml(np.period.name)} · ${np.period.time} <span>· ${np.cell.confirmed.length} of ${CAPACITY} in the room</span></span>
        </div>
        <div class="now-meter">
          <span class="left">${np.right}</span>
          <div class="track"><div style="width:${np.pct}%"></div></div>
        </div>
      </div>` : '';
    return `
      <section class="hero">
        <span class="tag"><span class="dot"></span>${longDay(days[0])} – ${longDay(days[days.length - 1])} · Next three weekdays</span>
        <h1 class="headline">${copy().h1a}<br><em>${copy().h1b}</em></h1>
        <p class="lede">${isAdmin
          ? 'Open a period, review requests, keep the room full but not over.'
          : `Every open period fits ${CAPACITY} players. Send a request, and you’re in once the admin confirms it.`}</p>
        ${nowHtml}
      </section>`;
  }

  // ---------- render: one period cell ----------
  function barsHtml(n, kind) {
    let h = '';
    for (let i = 0; i < CAPACITY; i++) h += `<span${i < n ? ' class="on"' : ''}></span>`;
    return `<span class="bars ${kind}" aria-hidden="true">${h}</span>`;
  }

  // Returns {cls, body, action} for a cell; used by both the grid and the phone list
  function cellParts(ds, period) {
    const key = cellKey(ds, period.id);
    const cell = getCell(ds, period.id);
    const n = cell.confirmed.length;
    const full = n >= CAPACITY;
    const ended = hasEnded(ds, period);
    const sup = cell.supervisor ? ' · ' + escapeHtml(cell.supervisor) : '';
    const btn = (action, label, cls) => `<button type="button" class="btn ${cls}" data-action="${action}" data-ds="${ds}" data-pid="${period.id}">${label}</button>`;

    if (cell.status === 'closed') {
      return {
        cls: 'closed',
        body: `<span class="closed-chip">${icon('lock')}Closed</span>`,
        action: isAdmin ? btn('open', 'Open', 'sm') : ''
      };
    }

    if (isAdmin) {
      const pend = cell.pending.length;
      let pills;
      if (ended) pills = `<span class="pill">Ended · ${n}/${CAPACITY}</span>`;
      else if (full) pills = `<span class="pill full"><i></i>Full · ${n}/${CAPACITY}</span>`;
      else pills = `<span class="pill open"><i></i>${n}/${CAPACITY} in</span>`;
      if (pend > 0) pills += `<span class="pill req">${pend} pending</span>`;
      return {
        cls: '',
        body: `<div class="cell-row">${pills}</div><div class="meta"><b>${escapeHtml(cell.supervisor) || 'No supervisor'}</b></div>`,
        action: btn('manage', 'Manage', ended ? 'sm' : 'sm primary')
      };
    }

    if (ended) {
      return {
        cls: '',
        body: `<div class="cell-row"><span class="pill">Ended</span></div><div class="meta"><b>Finished at ${period.end.replace(/^0/, '')}</b></div>`,
        action: ''
      };
    }
    const mine = myState(cell, key);
    if (mine === 'in') {
      return {
        cls: 'in',
        body: `<div class="cell-row"><span class="pill open">${icon('check')}You’re in</span>${barsHtml(n, 'open')}</div>
               <div class="meta"><b>Confirmed</b> · ${n} of ${CAPACITY}${sup}</div>`,
        action: ''
      };
    }
    if (mine === 'requested') {
      return {
        cls: 'req',
        body: `<div class="cell-row"><span class="pill req">${icon('clock')}Requested</span>${barsHtml(n, 'req')}</div>
               <div class="meta"><b>Awaiting confirmation</b> · ${n} of ${CAPACITY}</div>`,
        action: ''
      };
    }
    if (full) {
      return {
        cls: '',
        body: `<div class="cell-row"><span class="pill full"><i></i>Full</span>${barsHtml(n, 'full')}</div><div class="meta"><b>${n} of ${CAPACITY}</b>${sup}</div>`,
        action: ''
      };
    }
    return {
      cls: '',
      body: mine === 'declined'
        ? `<div class="cell-row"><span class="pill">${icon('x')}Not accepted</span>${barsHtml(n, 'open')}</div><div class="meta"><b>You can apply again</b> · ${n} of ${CAPACITY}</div>`
        : `<div class="cell-row"><span class="pill open"><i></i>Open</span>${barsHtml(n, 'open')}</div><div class="meta"><b>${n} of ${CAPACITY}</b>${sup}</div>`,
      action: `<button type="button" class="btn apply" data-action="apply" data-ds="${ds}" data-pid="${period.id}" aria-label="Apply for ${escapeHtml(period.name)}, ${longDay(new Date(ds + 'T00:00:00'))}">Apply${icon('arrow')}</button>`
    };
  }

  // ---------- render: schedule ----------
  function renderSetlist(days) {
    const today = new Date();
    const legend = isAdmin ? adminCounters(days) : `
      <div class="legend" aria-label="Legend">
        <span><i style="background:var(--teal)"></i>Open</span>
        <span><i style="background:var(--brass)"></i>Requested</span>
        <span><i style="background:var(--teal);outline:2px solid var(--teal);outline-offset:1px"></i>You’re in</span>
        <span><i style="background:var(--brick)"></i>Full</span>
        <span><i style="border:1.5px dashed var(--muted)"></i>Closed</span>
        <span><i style="background:var(--bar-off)"></i>Ended</span>
      </div>`;

    // Desktop grid: period rows x day columns
    let grid = '<div class="grid"><div aria-hidden="true"></div>';
    days.forEach(d => {
      const isToday = isSameDate(d, today);
      grid += `<div class="dhead${isToday ? ' today' : ''}">
        <span class="dname">${DAY_NAMES[d.getDay()].toUpperCase()}</span><span class="ddate">${monthDay(d)}</span>
        ${isToday ? '<span class="today-tag">Today</span>' : ''}</div>`;
    });
    PERIODS.forEach(p => {
      grid += `<div class="prow"><span class="pcode">${p.code}</span>
        <div style="display:flex;flex-direction:column;gap:2px;"><span class="pname${p.soft ? ' soft' : ''}">${p.name}</span><span class="ptime">${p.time}</span></div></div>`;
      days.forEach(d => {
        const part = cellParts(dateStr(d), p);
        grid += `<div class="cell ${part.cls}"><div class="cell-body">${part.body}</div>${part.action}</div>`;
      });
    });
    grid += '</div>';

    // Phone: day tabs + one day's list
    if (phoneDay >= days.length) phoneDay = 0;
    const tabs = days.map((d, i) => `<button type="button" data-phone-day="${i}" aria-pressed="${i === phoneDay}">
        <span class="dname">${DAY_NAMES[d.getDay()].toUpperCase()}</span><span class="ddate">${d.getDate()}</span></button>`).join('');
    const pds = dateStr(days[phoneDay]);
    const list = PERIODS.map(p => {
      const part = cellParts(pds, p);
      return `<div class="cell ${part.cls}"><span class="pcode">${p.code}</span>
        <div class="cell-body"><span class="ptitle"><span class="pname${p.soft ? ' soft' : ''}">${p.name}</span> · ${p.time}</span>${part.body}</div>${part.action}</div>`;
    }).join('');

    return `
      <section class="setlist" aria-labelledby="setlistTitle">
        <div class="setlist-head">
          <div class="setlist-title"><h2 id="setlistTitle">${copy().setlist}</h2>
            <span>${isAdmin ? 'Open a period, review requests, keep the room full but not over' : copy().pick}</span></div>
          ${legend}
        </div>
        ${grid}
        <div class="day-tabs phone-only" role="group" aria-label="Day">${tabs}</div>
        <div class="plist phone-only">${list}</div>
      </section>`;
  }

  function adminCounters(days) {
    let pending = 0, open = 0;
    days.forEach(d => PERIODS.forEach(p => {
      const c = getCell(dateStr(d), p.id);
      if (c.status === 'open') { open++; pending += c.pending.length; }
    }));
    return `<div class="counters">
      <span class="pill lg req">${pending} request${pending === 1 ? '' : 's'} waiting</span>
      <span class="pill lg open"><i></i>${open} of ${days.length * PERIODS.length} periods open</span></div>`;
  }

  function renderRules() {
    return `
      <section class="rules" id="rules" aria-labelledby="rulesTitle">
        <div style="display:flex;flex-direction:column;gap:4px;"><span class="eyebrow">${copy().rulesEyebrow}</span><h2 id="rulesTitle">${copy().rulesTitle}</h2></div>
        ${HOUSE_RULES.map((r, i) => `<div class="rule"><span class="num">${copy().nums[i]}</span><p>${r}</p></div>`).join('')}
      </section>`;
  }

  // ---------- main render ----------
  function render() {
    const days = getVisibleDays();
    renderNav();
    const html = renderHero(days) + renderSetlist(days) + renderRules();
    if (html === lastAppHtml) return;
    lastAppHtml = html;
    app.innerHTML = html;
    attachHandlers();
  }

  function attachHandlers() {
    app.querySelectorAll('button[data-action]').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action, ds = btn.dataset.ds, pid = btn.dataset.pid;
        if (action === 'open') openPeriodModal(ds, pid);
        else if (action === 'manage') openManageModal(ds, pid);
        else if (action === 'apply') openApplyModal(ds, pid);
      });
    });
    app.querySelectorAll('[data-phone-day]').forEach(b => b.addEventListener('click', () => {
      phoneDay = Number(b.dataset.phoneDay);
      render();
      const again = app.querySelector(`[data-phone-day="${phoneDay}"]`);
      if (again) again.focus();
    }));
  }

  // ---------- Firestore refs ----------
  const cellsRef = db.collection('cells');
  const supervisorsRef = db.collection('supervisors');
  const appsRef = db.collection('supervisorApps');
  const requestDetailsRef = db.collection('requestDetails');

  // Admin changes run as transactions on the server's current copy of the cell,
  // so a stale local view can never overfill a period or drop someone's request
  const cellQueues = {};
  const uidsOf = list => list.map(p => p.uid).filter(Boolean);
  function mutateCell(ds, pid, change) {
    const key = cellKey(ds, pid);
    const ref = cellsRef.doc(key);
    const run = () => db.runTransaction(async tx => {
      const snap = await tx.get(ref);
      const cur = normalizeCell(snap.exists ? snap.data() : null);
      const next = change(cur);
      // The rules check these to allow one live request per browser per period
      next.pendingUids = uidsOf(next.pending);
      next.confirmedUids = uidsOf(next.confirmed);
      tx.set(ref, next);
      return next;
    }).then(next => {
      // Show the admin's own change right away instead of waiting for the live listener
      cells[key] = next;
      render();
      if (activeManage) activeManage.refresh();
    });
    // Chain onto the previous write for this period (whether it succeeded or not)
    const next = (cellQueues[key] || Promise.resolve()).then(run, run);
    cellQueues[key] = next.catch(() => {});
    return next;
  }

  async function openCellWith(ds, pid, supName) {
    // Re-opening keeps earlier confirmed attendees and outcomes
    try { await mutateCell(ds, pid, cur => ({ ...cur, status: 'open', supervisor: supName })); }
    catch (e) { showToast('Could not open — ' + e.message); }
  }
  async function setSupervisor(ds, pid, supName) {
    try { await mutateCell(ds, pid, cur => ({ ...cur, supervisor: supName })); }
    catch (e) { showToast('Could not change supervisor — ' + e.message); }
  }
  async function closeCell(ds, pid) {
    // Keep confirmed for statistics; anyone still waiting counts as declined
    try {
      await mutateCell(ds, pid, cur => ({
        ...cur, status: 'closed', pending: [],
        declinedIds: [...cur.declinedIds, ...cur.pending.map(p => p.id)]
      }));
    } catch (e) { showToast('Could not close — ' + e.message); }
  }
  async function acceptPending(ds, pid, personId) {
    try {
      await mutateCell(ds, pid, cur => {
        if (cur.confirmed.length >= CAPACITY) throw new Error('this period is already full');
        const person = cur.pending.find(p => p.id === personId);
        if (!person) throw new Error('that request is no longer pending');
        return { ...cur, pending: cur.pending.filter(p => p.id !== personId), confirmed: [...cur.confirmed, person] };
      });
    } catch (e) { showToast('Could not accept — ' + e.message); }
  }
  async function declinePending(ds, pid, personId) {
    try {
      await mutateCell(ds, pid, cur => ({
        ...cur,
        pending: cur.pending.filter(p => p.id !== personId),
        declinedIds: cur.pending.some(p => p.id === personId) ? [...cur.declinedIds, personId] : cur.declinedIds
      }));
    } catch (e) { showToast('Could not decline — ' + e.message); }
  }
  async function removeConfirmed(ds, pid, personId) {
    try {
      await mutateCell(ds, pid, cur => ({
        ...cur,
        confirmed: cur.confirmed.filter(p => p.id !== personId),
        declinedIds: cur.confirmed.some(p => p.id === personId) ? [...cur.declinedIds, personId] : cur.declinedIds
      }));
    } catch (e) { showToast('Could not remove — ' + e.message); }
  }

  // The public entry holds only id + name; instrument and reason go to the
  // admin-only details doc. Both are written in one batch (the rules require it),
  // and arrayUnion lets simultaneous applicants all get in without clashing.
  async function applyToCell(ds, pid, name, instrument, note) {
    const cell = getCell(ds, pid);
    const period = PERIODS.find(p => p.id === pid);
    if (cell.status !== 'open' || hasEnded(ds, period)) { showToast('This period is no longer open'); return false; }
    if (cell.confirmed.length >= CAPACITY) { showToast('This period just filled up'); return false; }
    const key = cellKey(ds, pid);
    const state = myState(cell, key);
    if (state === 'in') { showToast('You’re already in this period'); return false; }
    if (state === 'requested') { showToast('You already asked for this period — wait for the admin'); return false; }
    const lower = name.toLowerCase();
    if ([...cell.pending, ...cell.confirmed].some(p => (p.name || '').trim().toLowerCase() === lower)) {
      showToast('That name is already on this period'); return false;
    }
    const uid = await ensureVisitorId();
    if (!uid) { showToast('Could not connect — please reload and try again'); return false; }
    const FV = firebase.firestore.FieldValue;
    const detailsDoc = requestDetailsRef.doc();
    const batch = db.batch();
    batch.set(detailsDoc, { cellId: key, name, instrument, note, uid, createdAt: FV.serverTimestamp() });
    batch.update(cellsRef.doc(key), { pending: FV.arrayUnion({ id: detailsDoc.id, name, uid }), pendingUids: FV.arrayUnion(uid) });
    try {
      await batch.commit();
      const mine = myRequests(); mine[key] = detailsDoc.id; store('pr-requests', mine);
      return true;
    } catch (e) {
      showToast(e.code === 'permission-denied'
        ? 'Could not send — the period may have closed or filled up, or you already asked for it'
        : 'Could not send request — ' + e.message);
      return false;
    }
  }

  // Visitors are signed in anonymously (no login screen) so the rules can tell browsers apart
  let visitorIdPromise = null;
  function ensureVisitorId() {
    const u = auth.currentUser;
    if (u && u.isAnonymous) return Promise.resolve(u.uid);
    if (u) return Promise.resolve(null);   // the admin doesn't apply
    if (!visitorIdPromise) {
      visitorIdPromise = auth.signInAnonymously()
        .then(cred => cred.user.uid)
        .catch(e => { console.warn('Anonymous sign-in failed', e.code); return null; })
        .finally(() => { visitorIdPromise = null; });
    }
    return visitorIdPromise;
  }

  // Admin only: fetch instrument/reason for the requests shown in the Manage window
  function ensureDetails(ids, onLoaded) {
    const missing = ids.filter(id => !(id in detailsCache) && !detailsLoading.has(id));
    if (missing.length === 0) return;
    missing.forEach(id => detailsLoading.add(id));
    Promise.all(missing.map(id => requestDetailsRef.doc(id).get().then(snap => {
      detailsCache[id] = snap.exists ? snap.data() : {};
    }).catch(() => { detailsCache[id] = {}; }).finally(() => detailsLoading.delete(id))))
      .then(onLoaded);
  }

  // ---------- live data ----------
  // Only listen to the visible days; re-subscribe when the window moves (e.g. after midnight)
  function subscribeCells() {
    const days = getVisibleDays();
    const key = days.map(dateStr).join(',');
    if (key === windowKey) return false;
    windowKey = key;
    if (unsubCells) unsubCells();
    const idPath = firebase.firestore.FieldPath.documentId();
    unsubCells = cellsRef
      .where(idPath, '>=', dateStr(days[0]))
      .where(idPath, '<', dateStr(days[days.length - 1]) + '_~')
      .onSnapshot(snap => {
        cells = {};
        snap.forEach(doc => { cells[doc.id] = doc.data(); });
        pruneMyRequests();
        render();
        if (activeManage) activeManage.refresh();
      }, err => showToast('Sync error — ' + err.message));
    return true;
  }

  function tick() {
    const moved = subscribeCells();
    const m = minuteKey();
    if (moved || m !== lastMinute) { lastMinute = m; render(); }
  }

  // ---------- modals ----------
  // Every modal: backdrop click / Escape closes, focus moves inside, and returns on close
  function openModal(html, { wide = false, label = 'Dialog', onClose } = {}) {
    const opener = document.activeElement;
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `<section class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(label)}">${html}</section>`;
    document.body.appendChild(backdrop);
    const modal = backdrop.firstElementChild;
    const close = () => {
      if (!backdrop.isConnected) return;
      backdrop.remove();
      document.removeEventListener('keydown', onKey);
      if (onClose) onClose();
      if (opener && opener.isConnected) opener.focus();
    };
    const onKey = (e) => {
      const open = document.querySelectorAll('.modal-backdrop');
      if (e.key === 'Escape' && open[open.length - 1] === backdrop) close();
    };
    document.addEventListener('keydown', onKey);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    const first = modal.querySelector('input, select, textarea, button');
    if (first) first.focus();
    return { backdrop, modal, close };
  }

  function periodTitle(ds, pid) {
    const period = PERIODS.find(p => p.id === pid);
    const d = new Date(ds + 'T00:00:00');
    return { period, when: `${longDay(d)} · ${period.time}` };
  }

  // "Me (name)" option; returns null name if the admin hasn't saved one yet
  function myDisplayName() { return (auth.currentUser && auth.currentUser.displayName) || ''; }
  function supervisorOptions(current) {
    const me = myDisplayName();
    const names = [];
    if (me) names.push({ value: me, label: `Me (${me})` });
    supervisors.forEach(s => { if (s.name !== me) names.push({ value: s.name, label: s.name }); });
    if (current && !names.some(n => n.value === current)) names.unshift({ value: current, label: current });
    return names.map(n => `<option value="${escapeHtml(n.value)}"${n.value === current ? ' selected' : ''}>${escapeHtml(n.label)}</option>`).join('');
  }

  function openPeriodModal(ds, pid) {
    const { period, when } = periodTitle(ds, pid);
    const myName = myDisplayName();
    let options = `<option value="__me__">Me (${myName ? escapeHtml(myName) : 'you'})</option>`;
    supervisors.forEach(s => { if (s.name !== myName) options += `<option value="${escapeHtml(s.name)}">${escapeHtml(s.name)}</option>`; });

    const { modal, close } = openModal(`
      <div class="modal-head"><span class="eyebrow-accent">${escapeHtml(when)}</span><h3>Open ${escapeHtml(period.name)}</h3>
        <span class="sub">Who’s supervising? Up to ${CAPACITY} people can join.</span></div>
      <label class="field">Supervisor<select id="supSelect">${options}</select></label>
      <label class="field" id="myNameWrap" hidden>Your name <span class="opt">(as visitors will see it — saved once)</span>
        <input type="text" id="myNameInput" maxlength="60" autocomplete="name"></label>
      <div class="modal-actions">
        <button type="button" class="btn sm ghost" id="mCancel">Cancel</button>
        <button type="button" class="btn sm primary" id="mConfirm">Open period</button>
      </div>`, { label: 'Open ' + period.name });
    const select = modal.querySelector('#supSelect');
    const nameWrap = modal.querySelector('#myNameWrap');
    const syncNameField = () => { nameWrap.hidden = !(select.value === '__me__' && !myName); };
    select.onchange = syncNameField;
    syncNameField();
    modal.querySelector('#mCancel').onclick = close;
    modal.querySelector('#mConfirm').onclick = async () => {
      let sup = select.value;
      if (sup === '__me__') {
        sup = myName;
        if (!sup) {
          sup = modal.querySelector('#myNameInput').value.trim();
          if (!sup) { showToast('Please enter your name'); return; }
          try { await auth.currentUser.updateProfile({ displayName: sup }); }
          catch (e) { showToast('Could not save your name — ' + e.message); return; }
        }
      }
      close();
      openCellWith(ds, pid, sup);
    };
  }

  function openManageModal(ds, pid) {
    const { period, when } = periodTitle(ds, pid);
    const key = cellKey(ds, pid);

    const detailOf = (p) => {
      const det = detailsCache[p.id];
      if (!det && p.instrument === undefined) return { loading: true };
      return { instrument: det && det.instrument !== undefined ? det.instrument : p.instrument, note: det && det.note !== undefined ? det.note : p.note };
    };

    const busyIds = new Set();
    const { modal, close } = openModal('', {
      wide: true, label: 'Manage ' + period.name,
      onClose: () => { if (activeManage && activeManage.key === key) activeManage = null; }
    });

    function draw() {
      const cell = getCell(ds, pid);
      const n = cell.confirmed.length;
      const left = CAPACITY - n;
      ensureDetails([...cell.pending, ...cell.confirmed].map(p => p.id), () => { if (activeManage && activeManage.key === key) draw(); });
      const focusedId = document.activeElement && document.activeElement.id;

      const waiting = cell.pending.length === 0
        ? '<div class="empty-note">No one is waiting.</div>'
        : `<div class="waiting">${cell.pending.map(p => {
            const d = detailOf(p);
            const inst = d.loading ? '' : (d.instrument ? ` <span>· ${escapeHtml(d.instrument)}</span>` : '');
            const reason = d.loading ? '<span class="wait-reason none">Loading…</span>'
              : d.note ? `<span class="wait-reason">“${escapeHtml(d.note)}”</span>` : '<span class="wait-reason none">No reason given</span>';
            return `<div class="wait-row${busyIds.has(p.id) ? ' busy' : ''}"><div class="wait-info"><span class="wait-name">${escapeHtml(p.name)}${inst}</span>${reason}</div>
              <button type="button" class="icon-btn solid" data-accept="${escapeHtml(p.id)}" aria-label="Accept ${escapeHtml(p.name)}">${icon('check')}</button>
              <button type="button" class="icon-btn danger" data-decline="${escapeHtml(p.id)}" aria-label="Decline ${escapeHtml(p.name)}">${icon('x')}</button></div>`;
          }).join('')}</div>`;

      const inRoom = n === 0
        ? '<div class="empty-note">No one confirmed yet.</div>'
        : `<div class="in-room">${cell.confirmed.map(p => {
            const d = detailOf(p);
            const title = !d.loading && (d.instrument || d.note) ? ` title="${escapeHtml([d.instrument, d.note].filter(Boolean).join(' · '))}"` : '';
            return `<span${title}${busyIds.has(p.id) ? ' class="busy"' : ''}>${escapeHtml(p.name)}<button type="button" data-remove="${escapeHtml(p.id)}" aria-label="Remove ${escapeHtml(p.name)}">${icon('x')}</button></span>`;
          }).join('')}</div>`;

      const warn = left === 1 && cell.pending.length > 0 ? '<span>Accepting one fills the room</span>'
        : left === 0 && cell.pending.length > 0 ? '<span>The room is full</span>' : '';

      modal.innerHTML = `
        <div class="modal-head-row">
          <div class="modal-head"><span class="eyebrow-accent">${escapeHtml(when)}</span><h3>${escapeHtml(period.name)}</h3></div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <span class="pill lg ${n >= CAPACITY ? 'full' : 'open'}"><i></i>${n}/${CAPACITY} in</span>
            ${left > 0 ? `<span class="pill lg full">${left} spot${left === 1 ? '' : 's'} left</span>` : ''}
          </div>
        </div>
        <label class="sup-switch">Supervisor<select id="mmSup">${supervisorOptions(cell.supervisor)}</select></label>
        <div class="list-head"><h4>Waiting · ${cell.pending.length}</h4>${warn}</div>
        ${waiting}
        <div class="list-head"><h4>In the room · ${n} of ${CAPACITY}</h4></div>
        ${inRoom}
        <div class="modal-actions split">
          <button type="button" class="btn sm danger" id="mmClosePeriod">Close period</button>
          <button type="button" class="btn sm primary" id="mmDone">Done</button>
        </div>`;

      // The live listener redraws after each change, so no manual redraw here
      const act = (b, fn, id) => { busyIds.add(id); b.closest('.wait-row, .in-room > span').classList.add('busy'); fn(ds, pid, id).finally(() => { busyIds.delete(id); if (activeManage && activeManage.key === key) draw(); }); };
      modal.querySelectorAll('[data-accept]').forEach(b => b.onclick = () => act(b, acceptPending, b.dataset.accept));
      modal.querySelectorAll('[data-decline]').forEach(b => b.onclick = () => act(b, declinePending, b.dataset.decline));
      modal.querySelectorAll('[data-remove]').forEach(b => b.onclick = () => act(b, removeConfirmed, b.dataset.remove));
      modal.querySelector('#mmSup').onchange = (e) => setSupervisor(ds, pid, e.target.value);
      modal.querySelector('#mmDone').onclick = close;
      modal.querySelector('#mmClosePeriod').onclick = () => { close(); closeCell(ds, pid); };
      const refocus = focusedId && modal.querySelector('#' + focusedId);
      if (refocus) refocus.focus();
    }

    activeManage = {
      key,
      refresh: () => {
        if (getCell(ds, pid).status === 'closed') { close(); showToast('This period was closed'); }
        else draw();
      }
    };
    draw();
    const done = modal.querySelector('#mmDone'); if (done) done.focus();
  }

  function openApplyModal(ds, pid) {
    const { period, when } = periodTitle(ds, pid);
    const cell = getCell(ds, pid);
    const { modal, close } = openModal(`
      <div class="modal-head"><span class="eyebrow-accent">${escapeHtml(when)}</span><h3>Apply for ${escapeHtml(period.name)}</h3>
        <span class="sub">${cell.confirmed.length} of ${CAPACITY} spots filled${cell.supervisor ? ' · ' + escapeHtml(cell.supervisor) : ''}</span></div>
      <label class="field">Your name<input type="text" id="applyName" placeholder="As other visitors will see it" maxlength="60" autocomplete="name"></label>
      <label class="field"><span>Instrument <span class="opt">(optional)</span></span><input type="text" id="applyInstrument" placeholder="e.g. Alto sax" maxlength="40"></label>
      <label class="field"><span>Reason <span class="opt">(optional)</span></span><textarea id="applyNote" rows="3" placeholder="What you are working on" maxlength="200"></textarea></label>
      <div class="note">${icon('eye')}<span>Other visitors only see your name. Your instrument and reason go to the admin.</span></div>
      <div class="modal-actions">
        <button type="button" class="btn sm ghost" id="applyCancel">Cancel</button>
        <button type="button" class="btn sm primary" id="applySubmit">Send request</button>
      </div>`, { label: 'Apply for ' + period.name });
    modal.querySelector('#applyCancel').onclick = close;
    const submit = modal.querySelector('#applySubmit');
    submit.onclick = async () => {
      const name = modal.querySelector('#applyName').value.trim();
      const instrument = modal.querySelector('#applyInstrument').value.trim();
      const note = modal.querySelector('#applyNote').value.trim();
      if (!name) { showToast('Please enter your name'); modal.querySelector('#applyName').focus(); return; }
      submit.disabled = true;
      const ok = await applyToCell(ds, pid, name, instrument, note);
      submit.disabled = false;
      if (ok) { close(); showToast(`Request sent for ${period.name}. It shows as Requested until the admin confirms.`); render(); }
    };
  }

  function openSupervisorAppModal() {
    const { modal, close } = openModal(`
      <div class="modal-head"><span class="eyebrow-accent">Join the roster</span><h3>Become a supervisor</h3>
        <span class="sub">The admin reviews every request. This doesn’t grant site access — it adds you to the supervisor list.</span></div>
      <label class="field">Your name<input type="text" id="supName" maxlength="60" autocomplete="name"></label>
      <label class="field"><span>Message <span class="opt">(optional)</span></span><textarea id="supMsg" rows="3" placeholder="Anything you’d like to add" maxlength="200"></textarea></label>
      <div class="modal-actions">
        <button type="button" class="btn sm ghost" id="supCancel">Cancel</button>
        <button type="button" class="btn sm primary" id="supSubmit">Send application</button>
      </div>`, { label: 'Become a supervisor' });
    modal.querySelector('#supCancel').onclick = close;
    modal.querySelector('#supSubmit').onclick = async () => {
      const name = modal.querySelector('#supName').value.trim();
      const message = modal.querySelector('#supMsg').value.trim();
      if (!name) { showToast('Please enter your name'); return; }
      try {
        await appsRef.add({ name, message, ts: firebase.firestore.FieldValue.serverTimestamp() });
        close();
        showToast('Application sent!');
      } catch (e) { showToast('Could not send — ' + e.message); }
    };
  }

  function openAdminLoginModal() {
    const { modal, close } = openModal(`
      <div class="modal-head"><span class="eyebrow-accent">Admin</span><h3>Sign in</h3><span class="sub">Only the room admin has this password.</span></div>
      <label class="field">Email<input type="email" id="adminEmail" autocomplete="username"></label>
      <label class="field">Password<input type="password" id="adminPass" autocomplete="current-password"></label>
      <div class="error-text" id="loginError" hidden></div>
      <div class="modal-actions">
        <button type="button" class="btn sm ghost" id="loginCancel">Cancel</button>
        <button type="button" class="btn sm primary" id="loginSubmit">Sign in</button>
      </div>`, { label: 'Admin sign in' });
    modal.querySelector('#loginCancel').onclick = close;
    const submit = async () => {
      const email = modal.querySelector('#adminEmail').value.trim();
      const pass = modal.querySelector('#adminPass').value;
      const errEl = modal.querySelector('#loginError');
      try { await auth.signInWithEmailAndPassword(email, pass); close(); }
      catch (e) { errEl.textContent = 'Sign-in failed — check email and password.'; errEl.hidden = false; }
    };
    modal.querySelector('#loginSubmit').onclick = submit;
    modal.querySelector('#adminPass').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  }

  // Shown once per browser; the rules strip stays on the page for everyone
  function maybeShowRulesNotice() {
    if (store('pr-rules-seen')) return;
    const { modal, close } = openModal(`
      <div class="modal-head"><span class="eyebrow-accent">${copy().rulesEyebrow}</span><h3>${copy().rulesTitle}</h3></div>
      <ol class="house">${HOUSE_RULES.map((r, i) => `<li><span class="num">${copy().nums[i]}</span><span>${r}</span></li>`).join('')}</ol>
      <div class="modal-actions"><button type="button" class="btn sm primary" id="discOk" style="width:100%;">Got it</button></div>`,
      { label: copy().rulesTitle, onClose: () => store('pr-rules-seen', true) });
    modal.querySelector('#discOk').onclick = close;
  }

  // ---------- sidebar (admin only) ----------
  function statCard(label, value) {
    return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-value">${escapeHtml(value)}</div></div>`;
  }

  function renderSidebar() {
    let overlay = document.getElementById('adminSidebarOverlay');
    renderNavBadgeOnly();
    if (!isAdmin || !sidebarOpen) { if (overlay) overlay.remove(); return; }
    const isNew = !overlay;

    let statsHtml;
    if (stats && typeof stats === 'object') {
      statsHtml = statCard('Most frequent visitor', stats.topVisitor)
        + statCard('Total hours supervised', stats.supervisedHours + ' h')
        + statCard('Total practice hours', stats.practiceHours + ' h')
        + statCard('Most popular instrument', stats.topInstrument);
    } else {
      statsHtml = `<div class="empty-note">${stats === 'error' ? 'Statistics could not be loaded.' : 'Loading statistics…'}</div>`;
    }

    const appsHtml = supervisorApps.length === 0
      ? '<div class="empty-note">No pending applications.</div>'
      : supervisorApps.map(a => `
        <div class="app-item">
          <div class="app-name">${escapeHtml(a.name)}</div>
          ${a.message ? `<div class="app-msg">“${escapeHtml(a.message)}”</div>` : ''}
          <div class="btn-row">
            <button type="button" class="btn sm primary" data-supaction="accept" data-id="${a.id}">Accept</button>
            <button type="button" class="btn sm danger" data-supaction="decline" data-id="${a.id}">Decline</button>
          </div>
        </div>`).join('');

    const supRows = supervisors.length === 0
      ? '<div class="empty-note">No approved supervisors yet.</div>'
      : supervisors.map(s => `
        <div class="sup-row">
          <span>${escapeHtml(s.name)}</span>
          <div class="sup-actions">
            <button type="button" class="icon-btn" data-editsup="${s.id}" data-name="${escapeHtml(s.name)}" aria-label="Rename ${escapeHtml(s.name)}">${icon('pencil')}</button>
            <button type="button" class="icon-btn danger" data-removesup="${s.id}" aria-label="Remove ${escapeHtml(s.name)}">${icon('trash')}</button>
          </div>
        </div>`).join('');

    const inner = `
        <div class="sidebar-head"><h2>Admin panel</h2><button type="button" class="icon-btn" id="sbClose" aria-label="Close admin panel">${icon('x')}</button></div>
        <div class="sec-title">Statistics</div>
        ${statsHtml}
        <div class="sec-title">Supervisor applications</div>
        ${appsHtml}
        <div class="sec-title">Approved supervisors</div>
        ${supRows}`;
    if (isNew) {
      overlay = document.createElement('div');
      overlay.id = 'adminSidebarOverlay';
      overlay.innerHTML = `<div class="sidebar-overlay" id="sbOverlayBg"></div><aside class="sidebar" role="dialog" aria-modal="true" aria-label="Admin panel"></aside>`;
      document.body.appendChild(overlay);
    }
    const aside = overlay.querySelector('.sidebar');
    if (!isNew && lastSidebarHtml === inner) return;   // nothing changed
    const hadFocus = aside.contains(document.activeElement);
    const prevScroll = aside.scrollTop;
    lastSidebarHtml = inner;
    aside.innerHTML = inner;
    aside.scrollTop = prevScroll;
    const closeSidebar = () => { sidebarOpen = false; renderSidebar(); const t = document.getElementById('sidebarToggle'); if (t) t.focus(); };
    document.getElementById('sbClose').onclick = closeSidebar;
    document.getElementById('sbOverlayBg').onclick = closeSidebar;
    // Keep keyboard focus inside the panel when its contents update
    if (isNew || hadFocus) document.getElementById('sbClose').focus();

    overlay.querySelectorAll('button[data-supaction]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const id = btn.dataset.id, action = btn.dataset.supaction;
        const entry = supervisorApps.find(a => a.id === id);
        if (!entry) return;
        try {
          if (action === 'accept') {
            const already = supervisors.some(s => s.name.toLowerCase() === entry.name.toLowerCase());
            if (!already) await supervisorsRef.add({ name: entry.name });
          }
          await appsRef.doc(id).delete();
        } catch (e) { showToast('Action failed — ' + e.message); }
      });
    });
    overlay.querySelectorAll('button[data-removesup]').forEach(btn => {
      btn.addEventListener('click', async () => {
        try { await supervisorsRef.doc(btn.dataset.removesup).delete(); }
        catch (e) { showToast('Could not remove — ' + e.message); }
      });
    });
    overlay.querySelectorAll('button[data-editsup]').forEach(btn => {
      btn.addEventListener('click', () => openRenameSupervisorModal(btn.dataset.editsup, btn.dataset.name));
    });
  }
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sidebarOpen && !document.querySelector('.modal-backdrop')) { sidebarOpen = false; renderSidebar(); }
  });

  // Keep the Admin panel badge current without re-rendering the whole nav
  function renderNavBadgeOnly() {
    const t = document.getElementById('sidebarToggle');
    if (!t) return;
    const n = supervisorApps.length;
    let badge = t.querySelector('.badge');
    if (n && !badge) { badge = document.createElement('span'); badge.className = 'badge'; t.appendChild(badge); }
    if (badge) { if (n) badge.textContent = n; else badge.remove(); }
    t.setAttribute('aria-label', 'Admin panel' + (n ? `, ${n} supervisor applications` : ''));
  }

  function openRenameSupervisorModal(id, currentName) {
    const { modal, close } = openModal(`
      <div class="modal-head"><h3>Rename supervisor</h3></div>
      <label class="field">Name<input type="text" id="renameInput" value="${escapeHtml(currentName)}" maxlength="60"></label>
      <div class="modal-actions">
        <button type="button" class="btn sm ghost" id="renameCancel">Cancel</button>
        <button type="button" class="btn sm primary" id="renameSave">Save</button>
      </div>`, { label: 'Rename supervisor' });
    modal.querySelector('#renameCancel').onclick = close;
    modal.querySelector('#renameSave').onclick = async () => {
      const newName = modal.querySelector('#renameInput').value.trim();
      if (!newName) { showToast('Name can’t be empty'); return; }
      try { await supervisorsRef.doc(id).update({ name: newName }); close(); }
      catch (e) { showToast('Could not rename — ' + e.message); }
    };
  }

  // ---------- startup ----------
  supervisorsRef.onSnapshot(snap => {
    supervisors = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    renderSidebar();
  }, err => console.error(err));

  auth.onAuthStateChanged(user => {
    const firstCheck = !authChecked;
    authChecked = true;
    isAdmin = !!(user && user.uid === ADMIN_UID);

    if (unsubApps) { unsubApps(); unsubApps = null; }
    if (isAdmin) {
      unsubApps = appsRef.onSnapshot(snap => {
        supervisorApps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        renderSidebar();
      }, err => showToast('Could not load applications — ' + err.message));
    } else {
      supervisorApps = [];
      sidebarOpen = false;
      stats = null;
      if (activeManage) { document.querySelectorAll('.modal-backdrop').forEach(b => b.remove()); activeManage = null; }
    }

    render();
    renderSidebar();
    if (!isAdmin && firstCheck) maybeShowRulesNotice();
    // Give every visitor browser its anonymous id up front, so "You're in" / "Requested" show on load
    if (!user) ensureVisitorId();
  });

  lastMinute = minuteKey();
  subscribeCells();
  render();
  setInterval(tick, TICK_MS);
  // Phones and background tabs silently drop the live connection. When the page comes
  // back, force a fresh connection so changes show without a manual reload.
  let hiddenAt = 0;
  function reconnect() {
    db.disableNetwork().then(() => db.enableNetwork()).catch(() => {});
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { hiddenAt = Date.now(); return; }
    if (hiddenAt && Date.now() - hiddenAt > 5000) reconnect();
    hiddenAt = 0;
    tick();
  });
  window.addEventListener('online', reconnect);
  window.addEventListener('pageshow', e => { if (e.persisted) reconnect(); });
})();
</script>
</body>
</html>
